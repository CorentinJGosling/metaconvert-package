<style>
/* ===== B — Two questions =================================================== */
.v2 .split{display:grid;grid-template-columns:214px minmax(0,1fr);}
.v2 .rail{border-right:1px solid var(--rule);padding:20px 20px 30px;
  background:var(--paper);}
.v2 .rail .cap{font-size:11.5px;color:var(--faint);margin:0 0 4px;}
.v2 .rail .capn{font-size:11.5px;color:var(--faint);margin:0 0 16px;
  line-height:1.5;padding-bottom:14px;border-bottom:1px solid var(--rule);}
.v2 .rail h4{font-size:11.5px;font-weight:600;color:var(--ink);
  margin:20px 0 7px;}
.v2 .rail h4:first-of-type{margin-top:0;}
.v2 .rail .fld{font-family:var(--mono);font-size:12px;color:var(--ink2);
  border-bottom:1px solid var(--rule);padding:3px 0 5px;
  display:flex;align-items:center;cursor:pointer;}
.v2 .rail .fld::after{content:"\2304";margin-left:auto;color:var(--faint);
  font-family:var(--sans);font-size:10px;position:relative;top:-2px;}
.v2 .rail .fld:hover{color:var(--rose-d);border-bottom-color:var(--rose);}
.v2 .rail label{display:flex;align-items:center;gap:8px;font-family:var(--mono);
  font-size:12px;color:var(--ink2);padding:3.5px 0;cursor:pointer;}
.v2 .rail label i{width:9px;height:9px;display:inline-block;flex:none;}
.v2 .rail .held{font-family:var(--mono);font-size:11.5px;color:var(--soft);
  line-height:1.9;}
.v2 .rail .held span{color:var(--faint);}

.v2 .main{padding:22px 34px 32px;min-width:0;}
.v2 .idline{display:flex;align-items:baseline;gap:12px;margin-bottom:4px;}
.v2 .idline .ix{font-family:var(--mono);font-size:12px;color:var(--rose-d);}
.v2 .idline h2{font-size:23px;font-weight:600;letter-spacing:-.02em;margin:0;}
.v2 .idline .arg{font-family:var(--mono);font-size:11.5px;color:var(--faint);
  margin-left:auto;}
.v2 .qline{font-family:var(--serif);font-size:16.5px;line-height:1.45;
  color:var(--soft);margin:0 0 22px;max-width:74ch;}

/* the estimand strip: what used to be a dropdown in a rail, and a tab nobody
   opened, is now the navigation for the page */
.v2 .estr{border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);}
.v2 .estr .lb{font-size:11.5px;color:var(--faint);padding:8px 0 0;}
.v2 .estr .row{display:flex;gap:0;flex-wrap:wrap;}
.v2 .estr button{appearance:none;background:none;border:0;cursor:pointer;
  font-family:var(--mono);font-size:12.5px;color:var(--soft);
  padding:9px 16px 10px;border-bottom:2px solid transparent;margin-bottom:-1px;
  white-space:nowrap;}
.v2 .estr button:first-child{padding-left:0;}
.v2 .estr button:hover{color:var(--ink);}
.v2 .estr button[aria-selected="true"]{color:var(--ink);
  border-bottom-color:var(--rose);}
/* the strip must not wrap: a second row of estimands reads as a second kind of
   control, which is the confusion this whole direction exists to remove */
.v2 .estr .row{flex-wrap:nowrap;overflow-x:auto;}
.v2 .estr .lb{display:flex;align-items:baseline;gap:14px;padding:7px 0 0;}
.v2 .estr .lb .aside{margin-left:auto;color:var(--faint);}

.v2 .qsec{margin-top:26px;}
.v2 .qsec>h3{font-family:var(--serif);font-size:19px;font-weight:400;
  margin:0 0 3px;letter-spacing:-.01em;line-height:1.3;}
.v2 .qsec>.ans{font-size:14px;color:var(--soft);margin:0 0 14px;max-width:80ch;
  line-height:1.55;}
.v2 .qsec>.ans b{color:var(--ink);font-weight:600;}
.v2 .qsec>.ans code{font-size:.9em;}

/* the ledger: routes down, reference quantities across. The mirror in it is
   the whole result of the study, and it needs no sentence. */
.v2 table.ledger{border-collapse:collapse;font-size:12.5px;width:100%;
  max-width:720px;}
.v2 table.ledger th{font-weight:400;font-size:11.5px;color:var(--soft);
  padding:0 0 8px 14px;text-align:right;white-space:nowrap;
  border-bottom:1px solid var(--ink);}
.v2 table.ledger th.l{text-align:left;padding-left:0;color:var(--faint);}
.v2 table.ledger th.on{color:var(--rose-d);font-weight:600;}
.v2 table.ledger td{font-family:var(--mono);text-align:right;
  padding:9px 0 9px 14px;color:var(--ink2);white-space:nowrap;
  border-bottom:1px solid var(--hair);}
.v2 table.ledger td.l{font-family:var(--mono);text-align:left;padding-left:0;
  color:var(--ink);}
.v2 table.ledger td.l i{width:9px;height:9px;display:inline-block;
  margin-right:8px;vertical-align:middle;position:relative;top:-1px;}
.v2 table.ledger td.on{background:var(--t1);}
.v2 table.ledger td .sm{display:block;font-size:11px;color:var(--faint);
  margin-top:2px;}
.v2 table.ledger td.bad{color:var(--rose-d);}
.v2 table.ledger tbody tr:last-child td{border-bottom:1.4px solid var(--ink);}
.v2 .lednote{font-size:12.5px;color:var(--faint);margin:10px 0 0;max-width:76ch;
  line-height:1.6;}
.v2 .lednote b{color:var(--soft);font-weight:500;}

.v2 .figsec{margin-top:30px;border-top:1px solid var(--ink);padding-top:14px;}
.v2 .figsec .fh{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;}
.v2 .figsec .fh h3{font-size:13px;font-weight:600;margin:0;}
.v2 .figsec .fh .sub{font-size:12px;color:var(--faint);}
.v2 .figsec .fh .key{margin-left:auto;font-family:var(--mono);font-size:11.5px;
  color:var(--soft);display:flex;gap:16px;}
.v2 .figsec .fh .key i{width:9px;height:9px;display:inline-block;margin-right:7px;
  vertical-align:middle;position:relative;top:-1px;}
@media(max-width:900px){.v2 .split{grid-template-columns:1fr;}
  .v2 .rail{border-right:0;border-bottom:1px solid var(--rule);}}
</style>
<style>
/* ===== C — Listing ======================================================== */
.v3{background:var(--white);}
.v3 .lst{padding:20px 34px 34px;font-size:13.5px;}
.v3 .idl{display:flex;align-items:baseline;gap:14px;padding:0 0 4px;}
.v3 .idl .st{font-family:var(--mono);font-size:20px;color:var(--rose-d);}
.v3 .idl h2{font-size:20px;font-weight:600;margin:0;letter-spacing:-.015em;}
.v3 .idl .arg{font-family:var(--mono);font-size:11.5px;color:var(--faint);
  margin-left:auto;}
.v3 .sub{font-size:13.5px;color:var(--soft);margin:0 0 16px;max-width:82ch;
  line-height:1.55;}

/* the query line: the whole control state as one editable sentence, set the
   way a call to the function would be */
.v3 .query{font-family:var(--mono);font-size:12.5px;line-height:2.1;
  color:var(--soft);background:var(--paper);border:1px solid var(--rule);
  padding:11px 15px;margin:0 0 6px;}
.v3 .query .kw{color:var(--faint);}
.v3 .query .edit{float:right;font-size:11.5px;color:var(--rose-d);
  text-decoration:none;border-bottom:1px solid var(--t2);}

/* run-in section heads: the label sits in the left gutter and the content
   starts on the same line, as a printed listing would set it */
.v3 .blk{display:grid;grid-template-columns:100px minmax(0,1fr);gap:0 24px;
  padding:17px 0;border-top:1px solid var(--rule);}
.v3 .blk>.gut{font-size:11.5px;color:var(--faint);padding-top:2px;
  line-height:1.5;}
.v3 .blk>.gut em{font-style:normal;display:block;font-family:var(--mono);
  color:var(--ink2);font-size:12px;}
.v3 .blk>.bd{min-width:0;}
.v3 .blk p{margin:0 0 9px;color:var(--soft);max-width:80ch;line-height:1.6;}
.v3 .blk p:last-child{margin-bottom:0;}
.v3 .blk p b{color:var(--ink);font-weight:600;}
.v3 .blk code{font-size:.9em;color:var(--ink2);}

/* numbered findings, marks hanging in the gutter of the body column */
.v3 ol.find{list-style:none;margin:0;padding:0;counter-reset:f;}
.v3 ol.find li{counter-increment:f;position:relative;padding:0 0 12px 30px;
  color:var(--soft);line-height:1.6;max-width:82ch;}
.v3 ol.find li:last-child{padding-bottom:0;}
.v3 ol.find li::before{content:counter(f);position:absolute;left:0;top:1px;
  font-family:var(--mono);font-size:11.5px;color:var(--rose-d);}
.v3 ol.find li b{color:var(--ink);font-weight:600;}
.v3 ol.find li code{font-size:.9em;}
.v3 .figrow{display:grid;grid-template-columns:minmax(0,1fr) 272px;gap:36px;
  align-items:start;}
.v3 .cap{font-size:11.5px;color:var(--faint);line-height:1.6;margin:10px 0 0;}
.v3 .cap b{color:var(--soft);font-weight:500;}
.v3 .key{font-family:var(--mono);font-size:11.5px;color:var(--soft);
  display:flex;gap:18px;margin:0 0 10px;}
.v3 .key i{width:9px;height:9px;display:inline-block;margin-right:7px;
  vertical-align:middle;position:relative;top:-1px;}
@media(max-width:820px){.v3 .blk{grid-template-columns:1fr;gap:6px;}
  .v3 .figrow{grid-template-columns:1fr;}}

/* ---------- closing comparison ------------------------------------------ */
.cmp{border-top:1px solid var(--ink);margin-top:10px;}
.cmp .row{display:grid;grid-template-columns:154px repeat(3,1fr);gap:0 24px;
  padding:15px 0;border-bottom:1px solid var(--hair);align-items:start;}
.cmp .row .l{font-size:12.5px;color:var(--faint);}
.cmp .row div{font-size:13.5px;color:var(--soft);line-height:1.5;}
.cmp .row.hd{border-bottom:1px solid var(--ink);padding-bottom:8px;}
.cmp .row.hd div{font-size:13px;font-weight:600;color:var(--ink);}
.cmp .row.hd .k{font-family:var(--mono);color:var(--rose-d);margin-right:8px;
  font-weight:400;}
@media(max-width:860px){.cmp .row{grid-template-columns:1fr;gap:4px;}
  .cmp .row .l{font-weight:600;color:var(--ink);margin-top:8px;}}
.foot{margin-top:46px;padding-top:12px;border-top:1px solid var(--rule);
  font-size:12px;color:var(--faint);line-height:1.7;}
.foot b{color:var(--soft);font-weight:500;}
</style>
