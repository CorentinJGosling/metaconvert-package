<style>
/* ===== A — Verdict ========================================================= */
.v1 .ask{padding:15px 22px 16px;border-bottom:1px solid var(--rule);
  background:var(--paper);}
.v1 .ask .cap{font-size:11.5px;color:var(--faint);margin-bottom:7px;}
.v1 .ask .sent{font-size:15px;line-height:1.9;color:var(--soft);max-width:none;}
.v1 .ask .sent b{color:var(--ink);font-weight:500;}
.v1 .body{padding:30px 40px 34px;}
.v1 .verdict{max-width:62ch;}
.v1 .verdict h2{font-size:29px;font-weight:600;letter-spacing:-.022em;
  margin:0 0 12px;line-height:1.15;}
.v1 .verdict h2 code{font-size:.92em;color:var(--ink);}
.v1 .verdict p{font-size:15px;line-height:1.6;color:var(--soft);margin:0 0 11px;}
.v1 .verdict p b{color:var(--ink);font-weight:600;}
.v1 .verdict p code{font-size:.88em;}

.v1 .sec{margin-top:32px;}
.v1 .sec>.h{display:flex;align-items:baseline;gap:14px;
  border-bottom:1px solid var(--ink);padding-bottom:6px;margin-bottom:14px;}
.v1 .sec>.h h3{font-size:13.5px;font-weight:600;margin:0;}
.v1 .sec>.h .sub{font-size:12px;color:var(--faint);margin-left:auto;
  font-family:var(--mono);}

/* the boundary grid: the signature. Every cell is a measured coverage value and
   its tint is that value's distance from nominal, banded at the simulation's
   own resolution limit. Nothing here is decoration. */
.v1 .grids{display:flex;gap:44px;flex-wrap:wrap;}
.v1 .gwrap{}
.v1 .gname{font-family:var(--mono);font-size:12.5px;margin:0 0 9px;
  display:flex;align-items:center;gap:8px;}
.v1 .gname i{width:9px;height:9px;display:inline-block;}
.v1 table.grid{border-collapse:collapse;font-family:var(--mono);font-size:11.5px;}
.v1 table.grid th{font-weight:400;color:var(--faint);font-size:11px;
  padding:0 0 6px;text-align:center;}
.v1 table.grid th.rh{text-align:right;padding-right:11px;padding-bottom:0;}
.v1 table.grid td{width:52px;height:29px;text-align:center;color:var(--ink2);
  border:1px solid var(--white);background:var(--hair);}
.v1 table.grid td.t1{background:var(--t1);}
.v1 table.grid td.t2{background:var(--t2);}
.v1 table.grid td.t3{background:var(--t3);color:#fff;}
.v1 table.grid td.t4{background:var(--t4);color:#fff;}
.v1 .axname{font-size:11px;color:var(--faint);margin-top:7px;text-align:center;}
.v1 .axl{font-size:11px;color:var(--faint);
  writing-mode:vertical-rl;transform:rotate(180deg);}
.v1 .ramp{display:flex;align-items:center;gap:0;margin-top:16px;font-size:11px;
  color:var(--faint);}
.v1 .ramp i{width:30px;height:10px;display:inline-block;}
.v1 .ramp .lb{margin-left:11px;}
.v1 .reading{max-width:34ch;font-size:13.5px;line-height:1.6;color:var(--soft);}
.v1 .reading b{color:var(--ink);font-weight:600;}
.v1 .reading p{margin:0 0 10px;}
.v1 .reading p:last-child{margin:0;}

/* the why block: two claims side by side, each with its evidence under it */
.v1 .why{display:grid;grid-template-columns:1fr 1fr;gap:0;}
.v1 .why>div{padding:0 30px 0 0;}
.v1 .why>div+div{padding:0 0 0 30px;border-left:1px solid var(--hair);}
.v1 .why .q{font-size:14.5px;font-weight:600;margin:0 0 8px;line-height:1.35;}
.v1 .why .a{font-size:13.5px;color:var(--soft);margin:0 0 12px;line-height:1.55;}
.v1 .why .a b{color:var(--ink);}
/* the evidence under each claim is a small table, not a run of loose numbers:
   two routes and two statistics need a row and a column to be read at all */
.v1 .why table.evt{border-collapse:collapse;font-size:12px;width:100%;
  max-width:330px;}
.v1 .why table.evt th{font-weight:400;color:var(--faint);font-size:11.5px;
  text-align:right;padding:0 0 6px 16px;white-space:nowrap;
  border-bottom:1px solid var(--rule);}
.v1 .why table.evt th.l{text-align:left;padding-left:0;}
.v1 .why table.evt thead th:not(.l){font-family:var(--mono);color:var(--ink2);}
.v1 .why table.evt td{font-family:var(--mono);text-align:right;
  padding:5px 0 5px 16px;color:var(--ink2);}
.v1 .why table.evt tbody th{font-weight:400;color:var(--soft);
  border-bottom:0;padding:5px 0 5px 0;text-align:left;font-size:11.5px;}
.v1 .why table.evt td.bad{color:var(--rose-d);background:var(--t1);}
.v1 .why .evcap{font-size:11.5px;color:var(--faint);margin:8px 0 0;
  line-height:1.5;}
@media(max-width:820px){.v1 .why{grid-template-columns:1fr;}
  .v1 .why>div+div{padding:20px 0 0;border-left:0;border-top:1px solid var(--hair);margin-top:18px;}}

/* view controls: deliberately quiet, and physically next to the figure they
   change rather than in a rail beside the finding they do not */
.v1 .view{display:flex;align-items:center;gap:0;flex-wrap:wrap;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  padding:9px 0;margin-top:30px;font-size:12.5px;}
.v1 .view .lb{font-size:11.5px;color:var(--faint);padding-right:18px;}
.v1 .view .it{padding:0 18px;border-left:1px solid var(--hair);color:var(--soft);}
.v1 .view .it b{font-weight:400;color:var(--faint);margin-right:7px;font-size:11.5px;}
.v1 .view .rt{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--faint);}
</style>
